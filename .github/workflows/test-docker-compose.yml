name: Test Docker Compose

on:
  pull_request:
    branches: [ main ]

env:
  GO_VERSION: "1.25"

jobs:
  # Unit tests for both Go modules. They need no Docker and finish quickly,
  # so they run in parallel with the (much slower) topology bring-ups.
  go-tests:
    name: go/${{ matrix.module }}
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        module: [tgen, webmesh]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run unit tests
        working-directory: ${{ matrix.module }}
        run: go test ./...

  # For each topology: generate it with tgen, build and bring the lab up,
  # then verify that every switch establishes the BGP sessions its generated
  # FRR config declares. The expected count is read straight from the tgen
  # output (one "neighbor ... interface" line per session), so the check is
  # fully driven by the generator and needs no hardcoding.
  topology:
    name: topology/${{ matrix.topology }}
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - topology: spine-leaf
            tgen-args: "-s 2 -l 4 -h 1"
            hosts: true
          - topology: ring
            tgen-args: "-r -n 4"
          - topology: mesh
            tgen-args: "-m -n 4"
          - topology: spine-leaf-srv6
            tgen-args: "-s 2 -l 4 -srv6"
            srv6: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Install Docker Compose v2
        run: |
          # Download and install docker compose v2
          sudo mkdir -p /usr/local/lib/docker/cli-plugins
          sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/lib/docker/cli-plugins/docker-compose
          sudo chmod +x /usr/local/lib/docker/cli-plugins/docker-compose

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            iproute2 \
            util-linux \
            jq

      - name: Pull docker-sonic-vs image
        run: |
          # Pull the arm64 docker-sonic-vs image from GHCR
          docker pull ghcr.io/mestery/docker-sonic-vs:latest

          # The compose files reference docker-sonic-vs:latest, so retag
          # the pulled image to match.
          docker tag ghcr.io/mestery/docker-sonic-vs:latest docker-sonic-vs:latest

          # Verify the image is present
          docker images | grep -q "docker-sonic-vs" || { echo "Error: docker-sonic-vs image is not present"; exit 1; }

      - name: Build tgen
        working-directory: tgen
        run: go build -o tgen .

      - name: Generate topology with tgen
        run: ./tgen/tgen ${{ matrix.tgen-args }} -o ./ci-${{ matrix.topology }}/

      - name: Validate Docker Compose file
        run: docker compose -f ci-${{ matrix.topology }}/docker-compose.yml config --quiet

      - name: Build all images
        run: docker compose -f ci-${{ matrix.topology }}/docker-compose.yml build

      - name: Bring up the lab
        run: |
          DIR="ci-${{ matrix.topology }}"
          COMPOSE="docker compose -f $DIR/docker-compose.yml"

          # Patch panel first, then the backing netns containers.
          $COMPOSE up -d webmesh
          $COMPOSE up -d $($COMPOSE config --services | grep -- '-linux$')

          # webmesh only reports healthy once every link is wired, so gate
          # the SONiC bring-up on that.
          for i in $(seq 1 90); do
            status=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}starting{{end}}' webmesh 2>/dev/null || echo "starting")
            if [ "$status" = "healthy" ]; then
              echo "webmesh is healthy — all links wired"
              break
            fi
            if [ "$i" -eq 90 ]; then
              echo "Timed out waiting for webmesh to wire links"
              docker logs webmesh
              exit 1
            fi
            sleep 2
          done

          # Start the SONiC containers (compose waits for webmesh healthy).
          $COMPOSE up -d

          echo "Running containers:"
          docker ps --filter "name=sonic-"

      - name: Verify BGP converged on every switch
        run: |
          # Opt out of the inherited errexit: a failing docker exec or grep
          # just yields a count of 0, which we handle explicitly below.
          set +e

          DIR="ci-${{ matrix.topology }}"

          for conf in "$DIR"/frr/*.conf; do
            sw=$(basename "$conf" .conf)
            # Each BGP session is one "neighbor <iface> interface" line.
            expected=$(grep -c "interface peer-group TRANSIT" "$conf")
            container="sonic-$sw"

            # Poll until every declared session is established (max ~5 min).
            # `show bgp summary` lists each neighbor once: an established peer
            # shows a number in its State/PfxRcd column (field 10), a down peer
            # a BGP FSM state word; newer FRR prints the literal "Establ". So
            # "established" == field 10 all-digits, or the row carries "Establ".
            ok=0
            for i in $(seq 1 60); do
              actual=$(docker exec "$container" vtysh -c "show bgp summary" 2>/dev/null | awk '$10 ~ /^[0-9]+$/ || /Establ/ {n++} END {print n+0}')
              if [ "${actual:-0}" -ge "$expected" ]; then ok=1; break; fi
              sleep 5
            done

            actual=$(docker exec "$container" vtysh -c "show bgp summary" 2>/dev/null | awk '$10 ~ /^[0-9]+$/ || /Establ/ {n++} END {print n+0}')
            echo "$container: ${actual:-0}/${expected} BGP sessions established"
            if [ "$ok" -ne 1 ]; then
              echo "FAIL: $container only established ${actual:-0}/${expected} BGP sessions"
              docker exec "$container" vtysh -c "show bgp summary" || true
              exit 1
            fi
          done

          echo "All switches in $DIR reached full BGP convergence."

      # Hosts only: apply the generated default addressing, then ping every
      # host pair in both families (no loss, no duplicate replies) and
      # re-address one host at runtime. Driven by the generated
      # addressing.txt; see the script header for details.
      - name: Verify host addressing and reachability
        if: ${{ matrix.hosts }}
        run: .github/scripts/verify-hosts.sh ci-${{ matrix.topology }}

      # SRv6-only: prove the overlay actually forwards, not just that BGP
      # converged. Everything is derived from the generated srv6/*.routes
      # files so the check is generator-driven, like the BGP check. Pairs
      # run in order over the two spines (transit), and each reply proves
      # decapsulation on the destination leaf.
      - name: Verify SRv6 overlay forwards
        if: ${{ matrix.srv6 }}
        run: |
          set +e
          DIR="ci-${{ matrix.topology }}"

          # Self-detect runner kernel support. If the kernel has no seg6,
          # route installation fails loudly at boot and pings can never
          # pass; report it clearly instead of failing the job.
          leaf=$(docker ps --format '{{.Names}}' | grep -- '-leaf' | head -1)
          if ! docker exec "$leaf" test -e /proc/sys/net/ipv6/conf/all/seg6_enabled; then
            echo "Runner kernel lacks seg6 (no seg6_enabled sysctl) — skipping"
            echo "data-plane checks. NOTE: seg6 routes were NOT installed, so"
            echo "this run verifies bring-up only, not the SRv6 forwarding."
            exit 0
          fi

          fail=0

          # 1. Every seg6 route the generator wrote must be in the kernel
          #    RIB of its source leaf, and the entry script must not have
          #    logged the "ERROR: SRv6" marker (loud failure path).
          for conf in "$DIR"/srv6/*.routes; do
            sw=$(basename "$conf" .routes)
            c="sonic-$sw"
            expected=$(grep -c "encap seg6" "$conf")
            ok=0
            for i in $(seq 1 40); do
              actual=$(docker exec "$c" ip -6 route show 2>/dev/null | grep -c "encap seg6")
              if [ "${actual:-0}" -ge "$expected" ]; then ok=1; break; fi
              sleep 3
            done
            actual=$(docker exec "$c" ip -6 route show 2>/dev/null | grep -c "encap seg6")
            echo "$c: ${actual:-0}/$expected seg6 routes installed"
            if [ "$ok" -ne 1 ]; then
              echo "FAIL: $c has ${actual:-0}/$expected seg6 routes"
              fail=1
            fi
            if docker logs "$c" 2>&1 | grep -q "ERROR: SRv6"; then
              echo "FAIL: $c logged an SRv6 route-install error"
              fail=1
            fi
          done

          # 2. Cross-leaf overlay ping matrix (all ordered pairs). Source is
          #    pinned to the sender's overlay /64 host address so the reply
          #    must find its return seg6 route too. Retried as a matrix for
          #    up to ~5 min: after BGP converges the learned locator routes
          #    still need a moment to reach every leaf's FIB.
          pingok=0
          for i in $(seq 1 40); do
            pingok=1
            for f in "$DIR"/srv6/*.routes; do
              s=$(basename "$f" .routes)
              # Skip spine nodes — they are transit-only, not overlay endpoints.
              [[ "$s" == spine* ]] && continue
              src=$(grep "Overlay prefix:" "$f" | awk '{print $NF}' | sed 's#/64##')
              # Destinations = every leaf's overlay prefix except the sender's own.
              for dst in $(grep -h "Overlay prefix:" "$DIR"/srv6/leaf*.routes | awk '{print $NF}' | sed 's#/64##' | grep -v "^${src}\$"); do
                docker exec "sonic-$s" ping -6 -c 3 -W 2 -I "${src}1" "${dst}1" >/dev/null 2>&1 || pingok=0
              done
            done
            [ "$pingok" -eq 1 ] && break
            sleep 5
          done

          if [ "$fail" -eq 0 ] && [ "$pingok" -eq 1 ]; then
            echo "SRv6 overlay verified: routes installed and all cross-leaf pings pass."
          else
            echo "FAIL: SRv6 overlay check failed (fail=$fail pingok=$pingok)"
            exit 1
          fi

      - name: Cleanup
        if: always()
        run: docker compose -f ci-${{ matrix.topology }}/docker-compose.yml down --remove-orphans || true