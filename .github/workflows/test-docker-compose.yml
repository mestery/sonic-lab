name: Test Docker Compose

on:
  pull_request:
    branches: [ main ]

jobs:
  test-docker-compose:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Install Docker Compose v2
        run: |
          # Download and install docker compose v2
          sudo mkdir -p /usr/local/lib/docker/cli-plugins
          sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/lib/docker/cli-plugins/docker-compose
          sudo chmod +x /usr/local/lib/docker/cli-plugins/docker-compose

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            iproute2 \
            util-linux \
            jq

      - name: Pull docker-sonic-vs image
        run: |
          # Pull the arm64 docker-sonic-vs image from GHCR
          echo "Pulling docker-sonic-vs image..."
          docker pull ghcr.io/mestery/docker-sonic-vs:latest

          # The compose files reference docker-sonic-vs:latest, so retag
          # the pulled image to match.
          docker tag ghcr.io/mestery/docker-sonic-vs:latest docker-sonic-vs:latest

          # Verify the image is present
          if ! docker images | grep -q "docker-sonic-vs"; then
            echo "Error: docker-sonic-vs image is not present"
            exit 1
          fi

      - name: Validate Docker Compose file
        run: |
          # Validate the docker-compose.yml syntax
          docker compose -f example/docker-compose.yml config --quiet

      - name: Build all images
        run: |
          docker compose -f example/docker-compose.yml build

      - name: Bring up all services
        run: |
          # Start all linux containers
          docker compose -f example/docker-compose.yml up -d spine1-linux leaf1-linux leaf2-linux

          # Wait for containers to be ready
          echo "Waiting for linux containers to start..."
          sleep 10

          # Now, start webmesh + sonic containers
          # (webmesh handles all veth wiring via its reconciler)
          docker compose -f example/docker-compose.yml up -d

          # Now wait for sonic containers to be ready
          echo "Waiting for sonic containers to start..."
          sleep 180

      - name: Verify all services are running
        run: |
          # Check that all containers are running
          echo "Checking container status..."
          docker compose -f example/docker-compose.yml ps -q | while read container; do
            if [ -n "$container" ]; then
              status=$(docker inspect --format='{{.State.Running}}' "$container")
              echo "Container $container status: $status"
              if [ "$status" != "true" ]; then
                echo "Error: Container $container is not running"
                exit 1
              fi
            fi
          done

      - name: Test show interface status command in spine1 container
        run: |
          # Test that we can execute "show interface status" command in spine1 container
          echo "Testing show interface status in spine1 container..."
          result=$(docker compose -f example/docker-compose.yml exec -T spine1 bash -c "show interface status" 2>&1)
          if [ $? -ne 0 ]; then
            echo "Error: Failed to run 'show interface status' in spine1 container"
            echo "Output: $result"
            exit 1
          else
            echo "Successfully executed 'show interface status' in spine1 container"
          fi

      - name: Test show interface status command in leaf1 container
        run: |
          # Test that we can execute "show interface status" command in leaf1 container
          echo "Testing show interface status in leaf1 container..."
          result=$(docker compose -f example/docker-compose.yml exec -T leaf1 bash -c "show interface status" 2>&1)
          if [ $? -ne 0 ]; then
            echo "Error: Failed to run 'show interface status' in leaf1 container"
            echo "Output: $result"
            exit 1
          else
            echo "Successfully executed 'show interface status' in leaf1 container"
          fi

      - name: Test show interface status command in leaf2 container
        run: |
          # Test that we can execute "show interface status" command in leaf2 container
          echo "Testing show interface status in leaf2 container..."
          result=$(docker compose -f example/docker-compose.yml exec -T leaf2 bash -c "show interface status" 2>&1)
          if [ $? -ne 0 ]; then
            echo "Error: Failed to run 'show interface status' in leaf2 container"
            echo "Output: $result"
            exit 1
          else
            echo "Successfully executed 'show interface status' in leaf2 container"
          fi

      - name: Cleanup
        if: always()
        run: |
          # Ensure any leftover containers are cleaned up  
          docker compose -f example/docker-compose.yml down --remove-orphans || true
